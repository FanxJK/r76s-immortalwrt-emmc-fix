name: Build ImmortalWrt 25.12.0 NanoPi R76S eMMC-fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils python3-setuptools \
            python3-pyelftools python3-venv \
            rsync swig unzip zlib1g-dev file wget curl ccache time jq \
            libelf-dev device-tree-compiler

      - name: Clone ImmortalWrt v25.12.0
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v25.12.0 https://github.com/immortalwrt/immortalwrt.git openwrt
          git -C openwrt log -1 --oneline

      - name: Apply RK3576 U-Boot eMMC HS200 workaround patch
        working-directory: openwrt
        run: |
          set -euxo pipefail
          cat > package/boot/uboot-rockchip/patches/109-rk3576-uboot-emmc-stability-fix.patch <<'PATCH'
          --- a/arch/arm/dts/rk3576-generic.dts
          +++ b/arch/arm/dts/rk3576-generic.dts
          @@ -28 +28 @@
          -	mmc-hs200-1_8v;
          +	max-frequency = <52000000>;
          PATCH
          test -f package/boot/uboot-rockchip/patches/109-rk3576-uboot-emmc-stability-fix.patch
          grep -n 'max-frequency = <52000000>' package/boot/uboot-rockchip/patches/109-rk3576-uboot-emmc-stability-fix.patch

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          set -euxo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure R76S-only build
        working-directory: openwrt
        run: |
          set -euxo pipefail
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r76s=y
          # CONFIG_TARGET_MULTI_PROFILE is not set
          # CONFIG_TARGET_ALL_PROFILES is not set
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          EOF
          make defconfig
          grep -E 'CONFIG_TARGET_rockchip|CONFIG_TARGET_rockchip_armv8_DEVICE_|CONFIG_TARGET_MULTI_PROFILE|CONFIG_TARGET_ALL_PROFILES|CONFIG_PACKAGE_luci' .config || true
          other_profiles=$(grep -E '^CONFIG_TARGET_rockchip_armv8_DEVICE_.*=y' .config | grep -v 'friendlyarm_nanopi-r76s' || true)
          if [ -n "$other_profiles" ]; then
            echo "Unexpected non-R76S device profiles enabled:"
            echo "$other_profiles"
            exit 1
          fi

      - name: Cache OpenWrt build toolchain
        uses: stupidloud/cachewrtbuild@main
        with:
          ccache: true
          toolchain: true
          skip: true
          prefix: openwrt
          mixkey: immortalwrt-25.12.0-rockchip-armv8-r76s

      - name: Download sources
        working-directory: openwrt
        run: |
          set -euxo pipefail
          make download -j$(nproc)

      - name: Build firmware
        working-directory: openwrt
        run: |
          set -euxo pipefail
          make -j$(nproc) || make -j1 V=s

      - name: Collect artifacts
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p artifact
          if [ -d openwrt/bin/targets/rockchip/armv8 ]; then
            cp -av openwrt/bin/targets/rockchip/armv8/* artifact/ || true
          fi
          cp -av openwrt/.config artifact/build.config || true
          cp -av openwrt/package/boot/uboot-rockchip/patches/109-rk3576-uboot-emmc-stability-fix.patch artifact/ || true
          find artifact -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.0-r76s-emmc-fix
          path: artifact/
          if-no-files-found: error
          retention-days: 14
