name: Build ImmortalWrt 25.12.1 NanoPi R76S eMMC-fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: immortalwrt-25.12.1-r76s-emmc-fix
  cancel-in-progress: false

env:
  IMMORTALWRT_VERSION: "25.12.1"
  ARTIFACT_NAME: immortalwrt-25.12.1-r76s-emmc-fix
  RELEASE_TAG: immortalwrt-25.12.1-r76s-emmc-fix-v1.2
  RELEASE_TITLE: ImmortalWrt 25.12.1 NanoPi R76S eMMC fix v1.2

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils python3-setuptools \
            python3-pyelftools python3-venv \
            rsync swig unzip zip zlib1g-dev file wget curl ccache time jq \
            libelf-dev device-tree-compiler

      - name: Clone ImmortalWrt v25.12.1
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "v${IMMORTALWRT_VERSION}" \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          test "$(git -C openwrt describe --tags --exact-match)" = "v${IMMORTALWRT_VERSION}"
          git -C openwrt log -1 --oneline

      - name: Apply RK3576 U-Boot eMMC HS200 workaround patch
        working-directory: openwrt
        run: |
          set -euxo pipefail
          cat > package/boot/uboot-rockchip/patches/109-rk3576-uboot-emmc-stability-fix.patch <<'PATCH'
          --- a/arch/arm/dts/rk3576-generic.dts
          +++ b/arch/arm/dts/rk3576-generic.dts
          @@ -28 +28 @@
          -	mmc-hs200-1_8v;
          +	max-frequency = <52000000>;
          PATCH
          test -f package/boot/uboot-rockchip/patches/109-rk3576-uboot-emmc-stability-fix.patch
          grep -n 'max-frequency = <52000000>' package/boot/uboot-rockchip/patches/109-rk3576-uboot-emmc-stability-fix.patch

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          set -euxo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add EasyTier packages
        working-directory: openwrt
        run: |
          set -euxo pipefail
          git clone https://github.com/EasyTier/luci-app-easytier.git \
            --depth=1 --single-branch package/luci-app-easytier
          test -f package/luci-app-easytier/easytier/Makefile
          test -f package/luci-app-easytier/luci-app-easytier/Makefile
          test -s package/luci-app-easytier/luci-app-easytier/po/zh_Hans/easytier.po
          git -C package/luci-app-easytier rev-parse HEAD | tee easytier-source-revision.txt
          git -C package/luci-app-easytier log -1 --oneline

      - name: Configure R76S-only build
        working-directory: openwrt
        run: |
          set -euxo pipefail
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r76s=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=512
          # CONFIG_TARGET_MULTI_PROFILE is not set
          # CONFIG_TARGET_ALL_PROFILES is not set
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-app-dockerman=y
          CONFIG_PACKAGE_luci-i18n-dockerman-zh-cn=y
          CONFIG_PACKAGE_luci-app-zerotier=y
          CONFIG_PACKAGE_luci-i18n-zerotier-zh-cn=y
          CONFIG_PACKAGE_luci-app-cloudflared=y
          CONFIG_PACKAGE_luci-i18n-cloudflared-zh-cn=y
          CONFIG_PACKAGE_easytier=y
          CONFIG_PACKAGE_luci-app-easytier=y
          CONFIG_PACKAGE_luci-i18n-easytier-zh-cn=y
          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_luci-i18n-diskman-zh-cn=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y
          EOF
          make defconfig
          grep -E 'CONFIG_TARGET_rockchip|CONFIG_TARGET_rockchip_armv8_DEVICE_|CONFIG_TARGET_ROOTFS_PARTSIZE|CONFIG_TARGET_MULTI_PROFILE|CONFIG_TARGET_ALL_PROFILES|CONFIG_PACKAGE_(luci|docker-compose|easytier)' .config || true
          grep -qx 'CONFIG_TARGET_ROOTFS_PARTSIZE=512' .config || {
            echo "Unexpected rootfs partition size; 512 MiB is required for the selected packages."
            exit 1
          }
          other_profiles=$(grep -E '^CONFIG_TARGET_rockchip_armv8_DEVICE_.*=y' .config | grep -v 'friendlyarm_nanopi-r76s' || true)
          if [ -n "$other_profiles" ]; then
            echo "Unexpected non-R76S device profiles enabled:"
            echo "$other_profiles"
            exit 1
          fi
          required_packages=(
            luci-i18n-base-zh-cn
            luci-app-dockerman
            luci-i18n-dockerman-zh-cn
            luci-app-zerotier
            luci-i18n-zerotier-zh-cn
            luci-app-cloudflared
            luci-i18n-cloudflared-zh-cn
            easytier
            luci-app-easytier
            luci-i18n-easytier-zh-cn
            luci-app-diskman
            luci-i18n-diskman-zh-cn
            luci-theme-argon
            luci-app-argon-config
            luci-i18n-argon-config-zh-cn
          )
          for package in "${required_packages[@]}"; do
            grep -qx "CONFIG_PACKAGE_${package}=y" .config || {
              echo "Required package is not enabled: ${package}"
              exit 1
            }
          done

      - name: Cache OpenWrt build toolchain
        uses: stupidloud/cachewrtbuild@main
        with:
          ccache: true
          toolchain: true
          skip: true
          prefix: openwrt
          mixkey: immortalwrt-25.12.1-rockchip-armv8-r76s-v1.2

      - name: Download sources
        working-directory: openwrt
        run: |
          set -euxo pipefail
          make download -j"$(nproc)"

      - name: Build firmware
        working-directory: openwrt
        run: |
          set -euxo pipefail
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect artifacts
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p artifact
          if [ -d openwrt/bin/targets/rockchip/armv8 ]; then
            cp -av openwrt/bin/targets/rockchip/armv8/* artifact/ || true
          fi
          cp -av openwrt/.config artifact/build.config || true
          cp -av openwrt/package/boot/uboot-rockchip/patches/109-rk3576-uboot-emmc-stability-fix.patch artifact/ || true
          cp -av openwrt/easytier-source-revision.txt artifact/ || true
          find artifact -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Prepare release archive
        run: |
          set -euo pipefail
          archive="artifact/${ARTIFACT_NAME}.zip"
          mapfile -d '' -t release_files < <(find artifact -maxdepth 1 -type f -print0 | sort -z)
          if [ "${#release_files[@]}" -eq 0 ]; then
            echo "No release files were produced."
            exit 1
          fi
          zip -9 -j "$archive" "${release_files[@]}"
          test -s "$archive"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' -t release_assets < <(find artifact -maxdepth 1 -type f -print0 | sort -z)
          if [ "${#release_assets[@]}" -eq 0 ]; then
            echo "No release assets were produced."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes-file RELEASE_NOTES.md
            gh release upload "$RELEASE_TAG" "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes-file RELEASE_NOTES.md \
              --target "$GITHUB_SHA"
          fi

          release_url="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          {
            echo "## Release published"
            echo
            echo "[$RELEASE_TAG]($release_url)"
            echo
            echo "### Assets"
            printf -- '- `%s`\n' "${release_assets[@]##*/}"
          } >> "$GITHUB_STEP_SUMMARY"
